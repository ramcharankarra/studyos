databases:
  - name: studyos-db
    databaseName: studyos
    user: studyos

services:
  - type: web
    name: studyos
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn studyos.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studyos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*" # Ensure to restrict in production
      - key: GEMINI_API_KEY
        sync: false # Requires manual entry in Render dashboard
