{% extends 'base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-12 text-center">
        <div class="bg-primary text-white p-5 rounded-3 mb-4 shadow position-relative overflow-hidden">
            <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(45deg, rgba(255,255,255,0.1), transparent);"></div>
            <h1 class="display-4 fw-bold position-relative z-index-1">{{ profile_user.full_name }}</h1>
            <p class="lead mb-0 position-relative z-index-1">@{{ profile_user.username }} | Teacher at StudyOS</p>
        </div>
    </div>
</div>
<div class="row text-center mt-5">
    <div class="col-12 text-muted">
        <i class="bi bi-person-badge fs-1"></i>
        <h4 class="mt-3">Teacher Profiles are private.</h4>
    </div>
</div>
{% endblock %}
