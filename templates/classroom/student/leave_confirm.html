{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5 border-danger">
            <div class="card-body text-center p-5">
                <i class="bi bi-box-arrow-right display-1 text-danger mb-3"></i>
                <h3 class="text-danger">Leave Class?</h3>
                <p class="fs-5">Are you sure you want to leave <strong>{{ enrollment.classroom.name }}</strong>?</p>
                <p class="text-muted">You will no longer have access to this class's quizzes or assignments. You will need the class code to join again.</p>
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg">Yes, Leave</button>
                    <a href="{% url 'classroom:student_classroom_detail' enrollment.id %}" class="btn btn-outline-secondary btn-lg ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
