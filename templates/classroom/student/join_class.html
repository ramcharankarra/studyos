{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-header bg-white">
                <h3 class="mb-0">Join a Class</h3>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">Ask your teacher for the class code, then enter it here.</p>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success">Join Class</button>
                        <a href="{% url 'classroom:my_classes' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
