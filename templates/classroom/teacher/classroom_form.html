{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-white pt-4 pb-3 border-bottom">
                <h3 class="mb-0 fw-bold"><i class="bi bi-person-video3 text-primary me-2"></i> {{ action }} Class</h3>
            </div>
            <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                            <a href="{% url 'classroom:class_list' %}" class="btn btn-outline-secondary px-4 me-2">Cancel</a>
                            <button type="submit" class="btn btn-success px-5 fw-bold shadow-sm">Save Class</button>
                        </div>
                    </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
