{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5 border-danger">
            <div class="card-body text-center p-5">
                <i class="bi bi-exclamation-triangle-fill display-1 text-danger mb-3"></i>
                <h3 class="text-danger">Delete Subject?</h3>
                <p class="fs-5">Are you sure you want to delete <strong>{{ subject.name }}</strong>?</p>
                <p class="text-muted">This action cannot be undone. It will also delete all associated classes and student enrollments.</p>
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg">Yes, Delete</button>
                    <a href="{% url 'classroom:subject_list' %}" class="btn btn-outline-secondary btn-lg ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
